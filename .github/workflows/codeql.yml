name: CodeQL

# CodeQL needs GitHub Advanced Security on private repositories, so it runs once
# the repository is public. On a private repository the analyze job is skipped.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: c-cpp, build-mode: manual }
          - { language: python, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: csharp, build-mode: manual }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build firmware for CodeQL
        if: matrix.language == 'c-cpp'
        run: |
          pip install --upgrade platformio
          pio run -e LILYGO-T-Dongle-S3

      - name: Build Agent for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build tools/Agent/Agent.csproj --configuration Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
