# gitleaks configuration for RedLilyGO.
#
# The default ruleset already covers the common credential formats. This file
# only adds allowlists for test fixtures and documentation examples that look
# secret-shaped but are not real secrets. Real credentials must never be
# committed; if a scan reports a genuine leak, rotate the secret and purge it
# from history rather than adding an allowlist entry.

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test values in docs, tests and payload demos."
paths = [
  '''tests/''',
  '''fuzz/''',
  '''docs/''',
  '''payloads/''',
  '''preview_server.py''',
]
regexTarget = "match"
regexes = [
  '''example\.test''',
  '''example\.com''',
  '''DEMO_ONLY''',
  '''demo@example\.test''',
  '''redlilygo''',
  '''CAFE:403F''',
]
