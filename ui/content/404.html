<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | RedLilyGO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/styles.min.css">
    <link rel="stylesheet" href="/assets/css/redlilygo.css">
    <link rel="stylesheet" href="/assets/css/tailwind.min.css">
</head>
<body class="bg-zinc-950 text-zinc-300 h-screen flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-14 shrink-0 bg-zinc-950/50 backdrop-blur-md border-b border-zinc-800/80 flex items-center justify-between px-4 md:px-6 sticky top-0 z-10 w-full">
        <div class="flex items-center gap-3">
            <span class="text-white font-bold text-[16px] tracking-tight flex items-center sidebar-logo-text">
                RedLilyG<i class="fa-solid fa-circle text-red-500 text-[12px] ml-[1.5px] mt-[0.5px]"></i>
            </span>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 flex items-center justify-center p-6 relative overflow-hidden">
        <!-- Background decorative elements -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/5 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="max-w-md w-full text-center relative z-10">
            <div class="relative mb-8 inline-block">
                <i class="fa-solid fa-triangle-exclamation text-red-500 text-6xl opacity-90 drop-shadow-[0_0_15px_rgba(239,68,68,0.3)]"></i>
                <div class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-lg animate-pulse">404</div>
            </div>
            
            <h1 class="text-2xl font-bold text-white mb-3">Page Not Found</h1>
            <p class="text-zinc-400 text-sm mb-8 leading-relaxed">
                The resource you are looking for has been moved, deleted, or does not exist on this device.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="bg-red-600 hover:bg-red-500 text-white font-semibold text-sm px-6 py-2.5 rounded-lg transition-colors inline-flex items-center justify-center gap-2">
                    <i class="fa-solid fa-house text-xs"></i> Return Home
                </a>
                <button onclick="window.history.back()" class="bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 hover:border-zinc-600 text-zinc-300 font-semibold text-sm px-6 py-2.5 rounded-lg transition-colors inline-flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-left text-xs"></i> Go Back
                </button>
            </div>
        </div>
    </main>
</body>
</html>
