name: RedLilyGO Firmware (PlatformIO)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Firmware and UI build tests are irrelevant to a dependency version bump
    # and are expensive, so Dependabot PRs skip them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build UI assets
        run: python build_ui.py

      - name: Verify source contracts
        run: |
          for check in tests/*_contract.mjs; do node "$check"; done

      - name: Verify firmware logic on host
        run: python tests/firmware_regressions.py

      - name: Verify macro server input and bind policy
        run: |
          python tests/macro_server_regressions.py
          python tests/build_assets_regressions.py
          python tests/preview_server_regressions.py

      - name: Verify UI source syntax
        run: |
          node --check ui/src/core/navigation.js
          node --check ui/src/features/tools/agent-status.js
          node --check ui/content/assets/js/ui.js
          node --check ui/vnc/core/rfb.js

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile UI tests
        working-directory: ui
        run: npm run test:e2e

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project LILYGO-T-Dongle-S3
        run: pio run --environment LILYGO-T-Dongle-S3

      - name: Upload LILYGO-T-Dongle-S3 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LILYGO-T-Dongle-S3 Firmware binaries
          path: |
            .pio/build/LILYGO-T-Dongle-S3/*.bin
            .pio/build/LILYGO-T-Dongle-S3/*.elf

  agent:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build Windows Agent
        run: dotnet build tools/Agent/Agent.csproj --configuration Release
      - name: Verify Agent protocol and transport
        run: dotnet run --project tools/Agent.Tests/Agent.Tests.csproj --configuration Release
      - name: Verify release package preflight
        run: .\tests\release_package_regressions.ps1
